# Render Blueprint: deploys the whole capstone as one web service.
# The build compiles the React client, then the Express API serves it (SERVE_CLIENT).
services:
  - type: web
    name: ai-product-research-dashboard
    runtime: node
    plan: free
    branch: dev
    healthCheckPath: /health
    buildCommand: cd server && npm ci --omit=dev && cd ../client && npm ci && npm run build && cd ../api && npm ci
    startCommand: cd api && npm start
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: SERVE_CLIENT
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: MONGO_URI
        sync: false # paste your MongoDB Atlas connection string in the Render dashboard
